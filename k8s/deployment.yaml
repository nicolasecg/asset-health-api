apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-health-api
  labels:
    app: asset-health-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asset-health-api
  template:
    metadata:
      labels:
        app: asset-health-api
    spec:
      containers:
        - name: api
          # Local (minikube): asset-health-api:1.0.0
          # Azure (AKS):      <ACR_NAME>.azurecr.io/asset-health-api:1.0.0
          image: asset-health-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: asset-health-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
